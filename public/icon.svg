    <circle cx="25" cy="-35" r="8" fill="#ffd700" stroke="#ffffff" stroke-width="2"/>
    <!-- Decorative dots -->
    <circle cx="0" cy="10" r="4" fill="#ffffff" opacity="0.8"/>
